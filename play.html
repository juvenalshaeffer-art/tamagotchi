    </script>

            <button class="ctrl-btn btn-b" id="btnRight"><span>➡️</span><span class="btn-label">ВПРАВО</span></button>

        <div class="instructions" id="instructions">ОТБИВАЙ МЯЧ! КНОПКИ А и Б</div>
        <a href="index.html" class="back-btn">⬅ НАЗАД</a>

    <script src="game.js"></script>
