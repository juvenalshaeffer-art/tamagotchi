<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍖 Кормление - Тамагочи</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram?.WebApp) {
                try { window.Telegram.WebApp.expand(); window.Telegram.WebApp.ready(); } catch(e) {}
            }
        });
    </script>
</head>
<body>
    <div class="tamagotchi">
        <div class="screen"><canvas id="gameCanvas"></canvas><div class="scanlines"></div></div>
        <div class="controls">
            <button class="ctrl-btn btn-a" id="btnLeft">⬅️</button>
            <button class="ctrl-btn btn-b" id="btnRight">➡️</button>
        </div>
        <div class="instructions" id="instructions">ЛОВИ РЫБКИ! КНОПКИ ← →</div>
        <a href="index.html" class="back-btn">⬅ НАЗАД</a>
    </div>
    <script>
        // ✅ ВСТРОЕННОЕ СОХРАНЕНИЕ (без зависимости от game.js)
        const catState = {
            name: 'КОТИК',
            hunger: 80,
            happiness: 80,
            health: 100,
            energy: 100
        };
        
        // Загрузка состояния
        try {
            const saved = localStorage.getItem('catState');
            if (saved) {
                const loaded = JSON.parse(saved);
                Object.assign(catState, loaded);
                console.log('✅ Загружено:', catState);
            }
        } catch(e) { console.error('❌ Ошибка загрузки:', e); }
        
        // Сохранение состояния
        function saveState() {
            try {
                localStorage.setItem('catState', JSON.stringify(catState));
                console.log('💾 Сохранено:', catState);
            } catch(e) { console.error('❌ Ошибка сохранения:', e); }
        }
        
        // Игра
        const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        const groundY = canvas.height - 60;
        let catX = canvas.width/2 - 35, catY = groundY - 50, catDirection = 1;
        let foodItems = [], score = 0, frame = 0, moveSpeed = 25;
        
        document.getElementById('instructions').style.display = 'block';
        setTimeout(() => { document.getElementById('instructions').style.display = 'none'; }, 4000);
        
        const btnLeft = document.getElementById('btnLeft'), btnRight = document.getElementById('btnRight');
        function moveLeft() { catX = Math.max(0, catX - moveSpeed); catDirection = -1; }
        function moveRight() { catX = Math.min(canvas.width - 80, catX + moveSpeed); catDirection = 1; }
        
        [btnLeft, btnRight].forEach((btn, i) => { 
            const fn = i ? moveRight : moveLeft; 
            btn.addEventListener('mousedown', e => { e.preventDefault(); fn(); }); 
            btn.addEventListener('touchstart', e => { e.preventDefault(); fn(); }); 
        });
        
        document.addEventListener('keydown', e => { 
            if (e.key === 'ArrowLeft') moveLeft(); 
            if (e.key === 'ArrowRight') moveRight(); 
        });
        
        function drawCat(x, y, direction) {
            ctx.save(); ctx.translate(x, y); 
            if (direction === -1) { ctx.scale(-1, 1); ctx.translate(-70, 0); }
            const tailWag = Math.sin(frame * 0.2) * 8; 
            ctx.fillStyle = '#A0A0A0'; 
            ctx.fillRect(-20, 30 + tailWag, 25, 8); 
            ctx.fillRect(-30, 25 + tailWag, 15, 8);
            const legOffset = Math.sin(frame * 0.3) * 8; 
            ctx.fillStyle = '#A0A0A0'; 
            ctx.fillRect(5 + legOffset, 48, 8, 12); 
            ctx.fillRect(20 - legOffset, 48, 8, 12);
            ctx.fillStyle = '#C0C0C0'; 
            ctx.fillRect(0, 20, 50, 30); 
            ctx.fillStyle = '#A0A0A0'; 
            ctx.fillRect(0, 35, 50, 15);
            ctx.fillStyle = '#808080'; 
            ctx.fillRect(10, 22, 6, 24); 
            ctx.fillRect(25, 22, 6, 24); 
            ctx.fillRect(40, 22, 6, 24);
            ctx.fillStyle = '#A0A0A0'; 
            ctx.fillRect(42 + legOffset, 48, 8, 12); 
            ctx.fillRect(55 - legOffset, 48, 8, 12);
            ctx.fillStyle = '#C0C0C0'; 
            ctx.fillRect(40, 5, 32, 26); 
            ctx.fillStyle = '#A0A0A0'; 
            ctx.fillRect(42, 0, 10, 10); 
            ctx.fillRect(60, 0, 10, 10);
            ctx.fillStyle = '#E0E0E0'; 
            ctx.fillRect(44, 2, 6, 6); 
            ctx.fillRect(62, 2, 6, 6);
            ctx.fillStyle = '#E0E0E0'; 
            ctx.fillRect(46, 10, 10, 10); 
            ctx.fillRect(62, 10, 10, 10);
            ctx.fillStyle = '#FFD000'; 
            ctx.fillRect(48, 12, 6, 6); 
            ctx.fillRect(64, 12, 6, 6);
            ctx.fillStyle = '#000'; 
            ctx.fillRect(50, 13, 3, 3); 
            ctx.fillRect(66, 13, 3, 3);
            ctx.fillStyle = '#FF80A0'; 
            ctx.fillRect(68, 20, 6, 5);
            ctx.fillStyle = '#E0E0E0'; 
            ctx.fillRect(35, 15, 12, 2); 
            ctx.fillRect(35, 19, 12, 2); 
            ctx.fillRect(35, 23, 12, 2); 
            ctx.fillRect(74, 15, 12, 2); 
            ctx.fillRect(74, 19, 12, 2); 
            ctx.fillRect(74, 23, 12, 2);
            ctx.restore();
        }
        
        function drawDetailedFish(food) {
            const x = food.x, y = food.y, w = food.width, h = food.height;
            
            // Хвост
            ctx.fillStyle = '#FF5555';
            ctx.beginPath();
            ctx.moveTo(x, y + h/2);
            ctx.lineTo(x - 12, y + h/4);
            ctx.lineTo(x - 12, y + h*3/4);
            ctx.closePath();
            ctx.fill();
            
            // Тело
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Брюшко
            ctx.fillStyle = '#FFB3B3';
            ctx.beginPath();
            ctx.ellipse(x + w/2, y + h/2 + 3, w/2 - 4, h/3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Чешуя
            ctx.fillStyle = '#FF8888';
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 4; col++) {
                    const sx = x + w/4 + col * (w/5);
                    const sy = y + h/3 + row * (h/4);
                    ctx.beginPath();
                    ctx.arc(sx, sy, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Плавники
            ctx.fillStyle = '#FF5555';
            ctx.beginPath();
            ctx.moveTo(x + w/3, y + h/2 - 5);
            ctx.lineTo(x + w/2, y - 8);
            ctx.lineTo(x + w*2/3, y + h/2 - 5);
            ctx.closePath();
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(x + w/3, y + h/2 + 5);
            ctx.lineTo(x + w/2, y + h + 8);
            ctx.lineTo(x + w*2/3, y + h/2 + 5);
            ctx.closePath();
            ctx.fill();
            
            // Глаз
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(x + w - 5, y + h/2 - 3, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(x + w - 3, y + h/2 - 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(x + w - 2, y + h/2 - 5, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Блик
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.ellipse(x + w/3, y + h/2 - 5, 8, 4, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#87CEEB'; 
            ctx.fillRect(0, 0, canvas.width, groundY);
            ctx.fillStyle = '#8B4513'; 
            ctx.fillRect(0, groundY, canvas.width, 60);
            ctx.fillStyle = '#228B22'; 
            ctx.fillRect(0, groundY, canvas.width, 12);
            
            if (Math.random() < 0.02) {
                foodItems.push({ 
                    x: Math.random() * (canvas.width - 30), 
                    y: -30, 
                    width: 30 + Math.random() * 10, 
                    height: 20 + Math.random() * 5,
                    wiggle: Math.random() * Math.PI
                });
            }
            
            foodItems.forEach((food, i) => {
                food.y += 3;
                food.wiggle += 0.1;
                
                drawDetailedFish(food);
                
                // Столкновение
                if (catX < food.x + food.width && catX + 70 > food.x &&
                    catY < food.y + food.height && catY + 50 > food.y) {
                    foodItems.splice(i, 1); 
                    score++; 
                    
                    // ✅ ВОССТАНОВЛЕНИЕ СЫТОСТИ
                    catState.hunger = Math.min(100, catState.hunger + 8);
                    console.log('🍖 Сытость:', catState.hunger);
                    
                    // ✅ СОХРАНЕНИЕ
                    saveState();
                    
                    // Вспышка
                    ctx.fillStyle = 'rgba(255,255,0,0.5)';
                    ctx.beginPath();
                    ctx.arc(catX + 35, catY + 25, 40, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                if (food.y > groundY) foodItems.splice(i, 1);
            });
            
            drawCat(catX, catY, catDirection);
            
            ctx.fillStyle = '#FFFF00'; 
            ctx.font = '10px "Press Start 2P"'; 
            ctx.fillText('СЪЕДЕНО: ' + score, 10, 30);
            ctx.fillStyle = '#FF6B6B';
            ctx.fillText('СЫТОСТЬ: ' + catState.hunger, 10, 50);
            
            frame++; 
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
