<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚶 Прогулка - Тамагочи</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили для кнопок управления */
        .controls {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 50;
        }
        
        .ctrl-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 4px solid #fff;
            color: #fff;
            font-size: 28px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            font-weight: bold;
        }
        
        .ctrl-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }
        
        .btn-a {
            background: linear-gradient(180deg, #4ECDC4 0%, #2AB7A9 100%);
        }
        
        .btn-b {
            background: linear-gradient(180deg, #FFD93D 0%, #E6C229 100%);
            color: #000;
        }
        
        .btn-label {
            font-size: 10px;
            margin-top: 3px;
            opacity: 0.9;
        }
        
        /* Для мобильных */
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div class="tamagotchi">
        <div class="screen">
            <canvas id="gameCanvas"></canvas>
            <div class="scanlines"></div>
        </div>
        
        <!-- 🎮 Кнопки управления для мобильных -->
        <div class="controls">
            <button class="ctrl-btn btn-a" id="btnJump">
                <span>🦘</span>
                <span class="btn-label">ПРЫГ</span>
            </button>
            <button class="ctrl-btn btn-b" id="btnDouble">
                <span>⚡</span>
                <span class="btn-label">2X</span>
            </button>
        </div>
        
        <div class="instructions" id="instructions">ПРЫГАЙ ЧЕРЕЗ КАМНИ! КНОПКИ А и Б</div>
        <a href="index.html" class="back-btn">⬅ НАЗАД</a>
    </div>

    <script src="game.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        
        const groundY = canvas.height - 60;
        let catX = 100;
        let catY = groundY - 50;
        let catVelocityY = 0;
        let isJumping = false;
        let canDoubleJump = false;
        let hasDoubleJumped = false;
        let obstacles = [];
        let score = 0;
        let frame = 0;
        
        // Настройки спавна
        const spawnRate = 0.008;
        const minGap = 350;
        let lastObstacleX = 0;
        
        document.getElementById('instructions').style.display = 'block';
        setTimeout(() => {
            document.getElementById('instructions').style.display = 'none';
        }, 4000);
        
        // 🎮 Управление кнопками
        const btnJump = document.getElementById('btnJump');
        const btnDouble = document.getElementById('btnDouble');
        
        function doJump() {
            if (!isJumping) {
                catVelocityY = -12;
                isJumping = true;
                canDoubleJump = true;
                hasDoubleJumped = false;
            }
        }
        
        function doDoubleJump() {
            if (isJumping && canDoubleJump && !hasDoubleJumped) {
                catVelocityY = -10;
                hasDoubleJumped = true;
                canDoubleJump = false;
            }
        }
        
        // Мышь
        btnJump.addEventListener('mousedown', (e) => { e.preventDefault(); doJump(); });
        btnDouble.addEventListener('mousedown', (e) => { e.preventDefault(); doDoubleJump(); });
        
        // Тач (мобильные)
        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
        btnDouble.addEventListener('touchstart', (e) => { e.preventDefault(); doDoubleJump(); });
        
        // Клавиатура (для десктопа)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'a' || e.key === 'A' || e.key === 'ф') {
                e.preventDefault();
                doJump();
            }
            if (e.key === 'b' || e.key === 'B' || e.key === 'и') {
                e.preventDefault();
                doDoubleJump();
            }
        });
        
        // 🐱 ПОЛНЫЙ КОТИК
        function drawCat(x, y, direction) {
            ctx.save();
            ctx.translate(x, y);
            
            if (direction === -1) {
                ctx.scale(-1, 1);
                ctx.translate(-70, 0);
            }
            
            // Хвост
            const tailWag = isJumping ? 0 : Math.sin(frame * 0.2) * 8;
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(-20, 30 + tailWag, 25, 8);
            ctx.fillRect(-30, 25 + tailWag, 15, 8);
            
            // Лапы
            const legOffset = isJumping ? 0 : Math.sin(frame * 0.3) * 8;
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(5 + legOffset, 48, 8, 12);
            ctx.fillRect(20 - legOffset, 48, 8, 12);
            
            // Тело
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(0, 20, 50, 30);
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(0, 35, 50, 15);
            
            // Полоски
            ctx.fillStyle = '#808080';
            ctx.fillRect(10, 22, 6, 24);
            ctx.fillRect(25, 22, 6, 24);
            ctx.fillRect(40, 22, 6, 24);
            
            // Передние лапы
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(42 + legOffset, 48, 8, 12);
            ctx.fillRect(55 - legOffset, 48, 8, 12);
            
            // Голова
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(40, 5, 32, 26);
            
            // Уши
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(42, 0, 10, 10);
            ctx.fillRect(60, 0, 10, 10);
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(44, 2, 6, 6);
            ctx.fillRect(62, 2, 6, 6);
            
            // Глаза
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(46, 10, 10, 10);
            ctx.fillRect(62, 10, 10, 10);
            ctx.fillStyle = '#FFD000';
            ctx.fillRect(48, 12, 6, 6);
            ctx.fillRect(64, 12, 6, 6);
            ctx.fillStyle = '#000';
            ctx.fillRect(50, 13, 3, 3);
            ctx.fillRect(66, 13, 3, 3);
            
            // Нос
            ctx.fillStyle = '#FF80A0';
            ctx.fillRect(68, 20, 6, 5);
            
            // Усы
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(35, 15, 12, 2);
            ctx.fillRect(35, 19, 12, 2);
            ctx.fillRect(35, 23, 12, 2);
            ctx.fillRect(74, 15, 12, 2);
            ctx.fillRect(74, 19, 12, 2);
            ctx.fillRect(74, 23, 12, 2);
            
            ctx.restore();
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Фон
            const skyGradient = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGradient.addColorStop(0, '#5C94FC');
            skyGradient.addColorStop(1, '#87CEEB');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, groundY);
            
            // Земля
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, groundY, canvas.width, 60);
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, groundY, canvas.width, 12);
            
            // Физика
            catVelocityY += 0.8;
            catY += catVelocityY;
            
            if (catY >= groundY - 50) {
                catY = groundY - 50;
                isJumping = false;
                catVelocityY = 0;
                canDoubleJump = false;
                hasDoubleJumped = false;
            }
            
            // Спавн камней
            if (Math.random() < spawnRate) {
                const spawnX = canvas.width + 50;
                if (spawnX - lastObstacleX >= minGap || obstacles.length === 0) {
                    obstacles.push({
                        x: spawnX,
                        y: groundY - 45,
                        width: 40,
                        height: 45
                    });
                    lastObstacleX = spawnX;
                }
            }
            
            // Отрисовка камней
            obstacles.forEach((obs, i) => {
                obs.x -= 5;
                
                ctx.fillStyle = '#5A5A5A';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 3;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                
                ctx.fillStyle = '#7A7A7A';
                ctx.fillRect(obs.x + 5, obs.y + 5, obs.width - 15, 10);
                
                ctx.fillStyle = '#3A3A3A';
                ctx.fillRect(obs.x + 5, obs.y + obs.height - 10, obs.width - 10, 8);
                
                // Столкновения
                const catBottom = catY + 50;
                const catRight = catX + 70;
                const catLeft = catX;
                const obsTop = obs.y;
                const obsBottom = obs.y + obs.height;
                const obsLeft = obs.x;
                const obsRight = obs.x + obs.width;
                
                const isColliding = catLeft < obsRight && catRight > obsLeft &&
                                    catBottom > obsTop && catY < obsBottom;
                
                if (isColliding) {
                    const isLandingOnTop = catVelocityY > 0 &&
                                          catBottom - obsTop < 25 &&
                                          catY + 25 < obsTop;
                    
                    if (isLandingOnTop) {
                        obstacles.splice(i, 1);
                        catVelocityY = -5;
                        score++;
                    } else {
                        catState.happiness = Math.max(0, catState.happiness - 10);
                        saveState();
                        window.location.href = 'index.html';
                    }
                }
                
                if (obs.x < -50) {
                    obstacles.splice(i, 1);
                    score++;
                }
            });
            
            // Направление котика
            let catDirection = 1;
            if (obstacles.length > 0 && obstacles[0].x < catX + 35) {
                catDirection = -1;
            }
            
            drawCat(catX, catY, catDirection);
            
            ctx.fillStyle = '#FFFF00';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('ПРОЙДЕНО: ' + score, 10, 30);
            
            // Индикатор двойного прыжка
            if (isJumping && canDoubleJump && !hasDoubleJumped) {
                ctx.fillStyle = '#00FF00';
                ctx.fillText('⚡ 2 ПРЫЖОК: ГОТОВ', 10, 50);
            }
            
            frame++;
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
