<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚶 Прогулка - Тамагочи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tamagotchi">
        <div class="screen">
            <canvas id="gameCanvas"></canvas>
            <div class="scanlines"></div>
        </div>
        <div class="instructions" id="instructions">ПРЫГАЙ ЧЕРЕЗ ПРЕПЯТСТВИЯ (ПРОБЕЛ)</div>
        <a href="index.html" class="back-btn">⬅ НАЗАД</a>
    </div>

    <script src="game.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        
        const groundY = canvas.height - 60;
        let catY = groundY - 50;
        let catVelocityY = 0;
        let isJumping = false;
        let obstacles = [];
        let score = 0;
        let frame = 0;
        
        document.getElementById('instructions').style.display = 'block';
        setTimeout(() => {
            document.getElementById('instructions').style.display = 'none';
        }, 4000);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isJumping) {
                e.preventDefault();
                catVelocityY = -12;
                isJumping = true;
            }
        });
        
        function drawCat(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(0, 20, 50, 30);
            ctx.fillRect(40, 5, 32, 26);
            ctx.fillStyle = '#FFD000';
            ctx.fillRect(46, 10, 10, 10);
            ctx.fillRect(62, 10, 10, 10);
            ctx.fillStyle = '#FF80A0';
            ctx.fillRect(68, 20, 6, 5);
            ctx.restore();
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, groundY);
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, groundY, canvas.width, 60);
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, groundY, canvas.width, 12);
            
            catVelocityY += 0.8;
            catY += catVelocityY;
            if (catY >= groundY - 50) {
                catY = groundY - 50;
                isJumping = false;
                catVelocityY = 0;
            }
            
            if (Math.random() < 0.015) {
                obstacles.push({
                    x: canvas.width,
                    y: groundY - 40,
                    width: 30,
                    height: 40
                });
            }
            
            ctx.fillStyle = '#4ECDC4';
            obstacles.forEach((obs, i) => {
                obs.x -= 5;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                if (100 < obs.x + obs.width && 150 > obs.x &&
                    catY < obs.y + obs.height && catY + 50 > obs.y) {
                    catState.happiness = Math.min(100, catState.happiness + 10);
                    catState.energy = Math.max(0, catState.energy - 10);
                    saveState();
                    window.location.href = 'index.html';
                }
                
                if (obs.x < -50) {
                    obstacles.splice(i, 1);
                    score++;
                }
            });
            
            drawCat(100, catY);
            
            ctx.fillStyle = '#FFFF00';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('ПРОЙДЕНО: ' + score, 10, 30);
            
            frame++;
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
