<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💚 Лечение - Тамагочи</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.expand();
        window.Telegram.WebApp.ready();
    }
</script>
</head>
<body>
    <div class="tamagotchi">
        <div class="screen">
            <canvas id="gameCanvas"></canvas>
            <div class="scanlines"></div>
        </div>
        <div class="instructions" id="instructions">КЛИКАЙ НА ТАБЛЕТКИ!</div>
        <a href="index.html" class="back-btn">⬅ НАЗАД</a>
    </div>

    <script src="game.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        
        let healTargets = [];
        let score = 0;
        let frame = 0;
        
        document.getElementById('instructions').style.display = 'block';
        setTimeout(() => {
            document.getElementById('instructions').style.display = 'none';
        }, 4000);
        
        // 💊 Создаём таблетки (разные формы)
        for (let i = 0; i < 6; i++) {
            const type = Math.random() > 0.5 ? 'capsule' : 'pill';
            healTargets.push({
                x: 150 + Math.random() * 200,
                y: 100 + Math.random() * 200,
                type: type,
                width: type === 'capsule' ? 35 : 25,
                height: type === 'capsule' ? 15 : 25,
                healed: false,
                rotation: Math.random() * Math.PI
            });
        }
        
        // Клик для лечения
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            healTargets.forEach(target => {
                if (!target.healed) {
                    const dist = Math.sqrt((x - target.x) ** 2 + (y - target.y) ** 2);
                    if (dist < target.width + 10) {
                        target.healed = true;
                        score++;
                        
                        // Эффект лечения (вспышка)
                        ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        if (score >= 6) {
                            catState.health = Math.min(100, catState.health + 30);
                            saveState();
                            window.location.href = 'index.html';
                        }
                    }
                }
            });
        });
        
        // 🐱 ПОЛНЫЙ КОТИК (с глазами, лапами, хвостом, усами)
        function drawCat(x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            // Хвост
            const tailWag = Math.sin(frame * 0.2) * 8;
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(-20, 30 + tailWag, 25, 8);
            ctx.fillRect(-30, 25 + tailWag, 15, 8);
            
            // Задние лапы
            const legOffset = Math.sin(frame * 0.3) * 8;
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(5 + legOffset, 48, 8, 12);
            ctx.fillRect(20 - legOffset, 48, 8, 12);
            
            // Тело
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(0, 20, 50, 30);
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(0, 35, 50, 15);
            
            // Полоски
            ctx.fillStyle = '#808080';
            ctx.fillRect(10, 22, 6, 24);
            ctx.fillRect(25, 22, 6, 24);
            ctx.fillRect(40, 22, 6, 24);
            
            // Передние лапы
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(42 + legOffset, 48, 8, 12);
            ctx.fillRect(55 - legOffset, 48, 8, 12);
            
            // Голова
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(40, 5, 32, 26);
            
            // Уши
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(42, 0, 10, 10);
            ctx.fillRect(60, 0, 10, 10);
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(44, 2, 6, 6);
            ctx.fillRect(62, 2, 6, 6);
            
            // Глаза
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(46, 10, 10, 10);
            ctx.fillRect(62, 10, 10, 10);
            ctx.fillStyle = '#FFD000';
            ctx.fillRect(48, 12, 6, 6);
            ctx.fillRect(64, 12, 6, 6);
            ctx.fillStyle = '#000';
            ctx.fillRect(50, 13, 3, 3);
            ctx.fillRect(66, 13, 3, 3);
            
            // Нос
            ctx.fillStyle = '#FF80A0';
            ctx.fillRect(68, 20, 6, 5);
            
            // Усы (с обеих сторон)
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(35, 15, 12, 2);
            ctx.fillRect(35, 19, 12, 2);
            ctx.fillRect(35, 23, 12, 2);
            ctx.fillRect(74, 15, 12, 2);
            ctx.fillRect(74, 19, 12, 2);
            ctx.fillRect(74, 23, 12, 2);
            
            ctx.restore();
        }
        
        // 💊 Рисуем таблетку
        function drawPill(target) {
            if (target.healed) return;
            
            ctx.save();
            ctx.translate(target.x, target.y);
            ctx.rotate(target.rotation);
            
            if (target.type === 'capsule') {
                // Капсула (двухцветная)
                ctx.fillStyle = '#FF6B6B';
                ctx.fillRect(-target.width/2, -target.height/2, target.width/2, target.height);
                ctx.fillStyle = '#4ECDC4';
                ctx.fillRect(0, -target.height/2, target.width/2, target.height);
                
                // Обводка
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.strokeRect(-target.width/2, -target.height/2, target.width, target.height);
                
                // Блик
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillRect(-target.width/2 + 3, -target.height/2 + 2, 8, 4);
            } else {
                // Круглая пилюля
                ctx.fillStyle = '#95E1D3';
                ctx.beginPath();
                ctx.arc(0, 0, target.height/2, 0, Math.PI * 2);
                ctx.fill();
                
                // Обводка
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Крестик на таблетке
                ctx.strokeStyle = '#FF6B6B';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-8, -8);
                ctx.lineTo(8, 8);
                ctx.moveTo(8, -8);
                ctx.lineTo(-8, 8);
                ctx.stroke();
                
                // Блик
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.arc(-5, -5, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Фон (больничная стена)
            ctx.fillStyle = '#E8F4F8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Плитка на стене
            ctx.strokeStyle = '#B8D8E0';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                for (let j = 0; j < canvas.height; j += 40) {
                    ctx.strokeRect(i, j, 40, 40);
                }
            }
            
            // Рисуем таблетки
            healTargets.forEach(target => {
                drawPill(target);
            });
            
            // Рисуем котика
            drawCat(100, 150);
            
            // Счёт
            ctx.fillStyle = '#FFFF00';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('ВЫЛЕЧЕНО: ' + score + '/6', 10, 30);
            
            // Прогресс бар
            ctx.fillStyle = '#333';
            ctx.fillRect(10, 45, 150, 10);
            ctx.fillStyle = '#00FF00';
            ctx.fillRect(10, 45, (score / 6) * 150, 10);
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.strokeRect(10, 45, 150, 10);
            
            frame++;
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
