<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Котик бежит</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        #gameCanvas {
            border: 3px solid #333;
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 100%);
            display: block;
        }
        
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            background: rgba(255,255,255,0.8);
            padding: 5px 15px;
            border-radius: 10px;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        #gameOver h2 {
            margin: 0 0 15px 0;
            color: #333;
        }
        
        #restartBtn {
            padding: 10px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restartBtn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.8);
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="score">Счёт: 0</div>
        <div id="instructions">Нажмите ПРОБЕЛ или кликните для прыжка</div>
        <div id="gameOver">
            <h2>Игра окончена!</h2>
            <p>Ваш счёт: <span id="finalScore">0</span></p>
            <button id="restartBtn">Играть снова</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // Параметры игры
        const game = {
            speed: 5,
            score: 0,
            isRunning: true,
            frame: 0,
            gravity: 0.6
        };

        // Котик
        const cat = {
            x: 100,
            y: 300,
            width: 60,
            height: 40,
            velocityY: 0,
            isJumping: false,
            groundY: 300,
            legFrame: 0
        };

        // Препятствия
        let obstacles = [];
        
        // Земля
        const ground = {
            y: 340,
            height: 60
        };

        // Класс препятствия (камень)
        class Obstacle {
            constructor() {
                this.width = 30 + Math.random() * 20;
                this.height = 30 + Math.random() * 30;
                this.x = canvas.width;
                this.y = ground.y - this.height;
                this.markedForDeletion = false;
            }

            update() {
                this.x -= game.speed;
                if (this.x + this.width < 0) {
                    this.markedForDeletion = true;
                    game.score++;
                    scoreElement.textContent = `Счёт: ${game.score}`;
                    // Увеличиваем скорость каждые 5 очков
                    if (game.score % 5 === 0) {
                        game.speed += 0.5;
                    }
                }
            }

            draw() {
                // Рисуем камень
                ctx.fillStyle = '#696969';
                ctx.beginPath();
                ctx.ellipse(
                    this.x + this.width/2, 
                    this.y + this.height/2, 
                    this.width/2, 
                    this.height/2, 
                    0, 0, Math.PI * 2
                );
                ctx.fill();
                
                // Тень
                ctx.fillStyle = '#505050';
                ctx.beginPath();
                ctx.ellipse(
                    this.x + this.width/2, 
                    this.y + this.height - 5, 
                    this.width/2 - 5, 
                    8, 
                    0, 0, Math.PI * 2
                );
                ctx.fill();
            }
        }

        // Прыжок
        function jump() {
            if (!cat.isJumping && game.isRunning) {
                cat.velocityY = -12;
                cat.isJumping = true;
            }
        }

        // Рисуем котика
        function drawCat() {
            ctx.save();
            ctx.translate(cat.x, cat.y);
            
            // Тень под котиком
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(30, 38, 25, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Хвост
            ctx.strokeStyle = '#808080';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(5, 25);
            ctx.quadraticCurveTo(-5, 15, -8, 5);
            ctx.stroke();
            
            // Задние лапы (анимация бега)
            ctx.fillStyle = '#808080';
            if (!cat.isJumping) {
                const legOffset = Math.sin(game.frame * 0.3) * 10;
                // Задняя левая
                ctx.beginPath();
                ctx.ellipse(15 + legOffset, 35, 5, 8, 0.2, 0, Math.PI * 2);
                ctx.fill();
                // Задняя правая
                ctx.beginPath();
                ctx.ellipse(25 - legOffset, 35, 5, 8, -0.2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Лапы в прыжке
                ctx.beginPath();
                ctx.ellipse(15, 32, 5, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(25, 32, 5, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Тело
            ctx.fillStyle = '#A0A0A0';
            ctx.beginPath();
            ctx.ellipse(30, 25, 28, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Передние лапы
            if (!cat.isJumping) {
                const frontLegOffset = Math.cos(game.frame * 0.3) * 10;
                ctx.beginPath();
                ctx.ellipse(45 + frontLegOffset, 35, 5, 8, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(52 - frontLegOffset, 35, 5, 8, 0.2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.ellipse(48, 30, 5, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(55, 30, 5, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Голова
            ctx.beginPath();
            ctx.arc(55, 18, 14, 0, Math.PI * 2);
            ctx.fill();
            
            // Уши
            ctx.beginPath();
            ctx.moveTo(45, 10);
            ctx.lineTo(48, 0);
            ctx.lineTo(52, 8);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(58, 8);
            ctx.lineTo(62, 0);
            ctx.lineTo(65, 10);
            ctx.fill();
            
            // Внутренняя часть ушей
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.moveTo(47, 8);
            ctx.lineTo(49, 2);
            ctx.lineTo(51, 7);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(59, 7);
            ctx.lineTo(61, 2);
            ctx.lineTo(63, 8);
            ctx.fill();
            
            // Глаза
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(58, 16, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(68, 16, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Зрачки
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(59, 16, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(69, 16, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Зрачки (чёрные)
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(59, 16, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(69, 16, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Нос
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.arc(63, 21, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Усы
            ctx.strokeStyle = '#606060';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(55, 20);
            ctx.lineTo(45, 18);
            ctx.moveTo(55, 22);
            ctx.lineTo(45, 22);
            ctx.moveTo(55, 24);
            ctx.lineTo(45, 26);
            ctx.stroke();
            
            ctx.restore();
        }

        // Обновление котика
        function updateCat() {
            // Физика прыжка
            cat.velocityY += game.gravity;
            cat.y += cat.velocityY;

            if (cat.y >= cat.groundY) {
                cat.y = cat.groundY;
                cat.isJumping = false;
                cat.velocityY = 0;
            }
        }

        // Спавн препятствий
        let obstacleTimer = 0;
        let obstacleInterval = 100;

        function handleObstacles() {
            obstacleTimer++;
            if (obstacleTimer > obstacleInterval) {
                obstacles.push(new Obstacle());
                obstacleTimer = 0;
                // Случайный интервал между препятствиями
                obstacleInterval = 60 + Math.random() * 60;
            }

            obstacles.forEach(obstacle => {
                obstacle.update();
                obstacle.draw();
            });

            obstacles = obstacles.filter(obs => !obs.markedForDeletion);
        }

        // Проверка столкновений
        function checkCollisions() {
            for (let obstacle of obstacles) {
                if (
                    cat.x < obstacle.x + obstacle.width &&
                    cat.x + cat.width > obstacle.x &&
                    cat.y < obstacle.y + obstacle.height &&
                    cat.y + cat.height > obstacle.y
                ) {
                    gameOver();
                }
            }
        }

        // Рисуем землю
        function drawGround() {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, ground.y, canvas.width, ground.height);
            
            // Трава
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, ground.y, canvas.width, 10);
        }

        // Конец игры
        function gameOver() {
            game.isRunning = false;
            finalScoreElement.textContent = game.score;
            gameOverScreen.style.display = 'block';
        }

        // Перезапуск
        function restart() {
            game.speed = 5;
            game.score = 0;
            game.isRunning = true;
            game.frame = 0;
            
            cat.y = cat.groundY;
            cat.velocityY = 0;
            cat.isJumping = false;
            
            obstacles = [];
            obstacleTimer = 0;
            
            scoreElement.textContent = 'Счёт: 0';
            gameOverScreen.style.display = 'none';
            
            animate();
        }

        // Игровой цикл
        function animate() {
            if (!game.isRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGround();
            updateCat();
            drawCat();
            handleObstacles();
            checkCollisions();

            game.frame++;
            requestAnimationFrame(animate);
        }

        // Управление
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        restartBtn.addEventListener('click', restart);

        // Запускаем игру сразу
        animate();
    </script>
</body>
</html>
