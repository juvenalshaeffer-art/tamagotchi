<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Котик бежит</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 100%);
        }
        
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: clamp(16px, 4vw, 24px);
            font-weight: bold;
            color: #333;
            background: rgba(255,255,255,0.9);
            padding: 8px 15px;
            border-radius: 10px;
            z-index: 10;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 20;
            min-width: 200px;
        }
        
        #gameOver h2 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: clamp(18px, 5vw, 24px);
        }
        
        #gameOver p {
            margin: 10px 0;
            font-size: clamp(14px, 4vw, 18px);
        }
        
        #restartBtn {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: clamp(14px, 4vw, 18px);
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #restartBtn:active {
            background: #45a049;
            transform: scale(0.95);
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: clamp(12px, 3.5vw, 16px);
            text-align: center;
            z-index: 10;
            white-space: nowrap;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(16px, 4vw, 24px);
            color: #333;
            background: rgba(255,255,255,0.9);
            padding: 20px 30px;
            border-radius: 10px;
            z-index: 30;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="score">Счёт: 0</div>
        <div id="instructions">Нажмите ПРОБЕЛ или коснитесь экрана для прыжка</div>
        <div id="loading">Загрузка...</div>
        <div id="gameOver">
            <h2>Игра окончена!</h2>
            <p>Ваш счёт: <span id="finalScore">0</span></p>
            <button id="restartBtn">Играть снова</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const loadingScreen = document.getElementById('loading');
        const instructions = document.getElementById('instructions');

        // Адаптивный размер canvas
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            ground.y = canvas.height - 60;
            cat.groundY = canvas.height - 100;
            
            if (!cat.isJumping) {
                cat.y = cat.groundY;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Загружаем спрайт
        const sprite = new Image();
        sprite.src = 'cat-sprite.png';

        let spriteLoaded = false;

        sprite.onload = () => {
            spriteLoaded = true;
            loadingScreen.style.display = 'none';
            setTimeout(() => {
                instructions.style.display = 'none';
            }, 3000);
        };

        sprite.onerror = () => {
            loadingScreen.textContent = 'Ошибка! Не найден cat-sprite.png';
        };

        // Параметры игры
        const game = {
            speed: 5,
            score: 0,
            isRunning: false,
            frame: 0,
            gravity: 0.8
        };

        // Котик
        const cat = {
            x: 80,
            y: 0,
            width: 0,
            height: 0,
            velocityY: 0,
            isJumping: false,
            groundY: 0,
            spriteFrame: 0,
            spriteRow: 0,
            frameCounter: 0
        };

        // НАСТРОЙКИ СПРАЙТА - измените под ваш файл!
        const spriteConfig = {
            frameWidth: 64,
            frameHeight: 64,
            framesPerRow: 6,
            totalRows: 4,
            animationSpeed: 4,
            scaleFactor: 1.2
        };

        // Препятствия
        let obstacles = [];
        
        // Земля
        const ground = {
            y: 0,
            height: 60
        };

        class Obstacle {
            constructor() {
                this.width = 30 + Math.random() * 20;
                this.height = 30 + Math.random() * 30;
                this.x = canvas.width;
                this.y = ground.y - this.height;
                this.markedForDeletion = false;
            }

            update() {
                this.x -= game.speed;
                if (this.x + this.width < 0) {
                    this.markedForDeletion = true;
                    game.score++;
                    scoreElement.textContent = `Счёт: ${game.score}`;
                    if (game.score % 5 === 0) {
                        game.speed += 0.5;
                    }
                }
            }

            draw() {
                ctx.fillStyle = '#696969';
                ctx.beginPath();
                ctx.ellipse(
                    this.x + this.width/2, 
                    this.y + this.height/2, 
                    this.width/2, 
                    this.height/2, 
                    0, 0, Math.PI * 2
                );
                ctx.fill();
                
                ctx.fillStyle = '#505050';
                ctx.beginPath();
                ctx.ellipse(
                    this.x + this.width/2, 
                    this.y + this.height - 5, 
                    this.width/2 - 5, 
                    8, 
                    0, 0, Math.PI * 2
                );
                ctx.fill();
            }
        }

        function jump() {
            if (!cat.isJumping && game.isRunning) {
                cat.velocityY = -15;
                cat.isJumping = true;
            }
        }

        function updateCat() {
            cat.velocityY += game.gravity;
            cat.y += cat.velocityY;

            if (cat.y >= cat.groundY) {
                cat.y = cat.groundY;
                cat.isJumping = false;
                cat.velocityY = 0;
                cat.spriteRow = 0;
            } else {
                cat.spriteRow = 2 + Math.floor(cat.frameCounter / 5) % 2;
            }

            cat.frameCounter++;
            if (cat.frameCounter >= spriteConfig.animationSpeed) {
                cat.frameCounter = 0;
                cat.spriteFrame++;
                
                if (cat.spriteFrame >= spriteConfig.framesPerRow) {
                    cat.spriteFrame = 0;
                }
            }
        }

        function drawCat() {
            if (spriteLoaded && sprite.complete) {
                const frameWidth = spriteConfig.frameWidth * spriteConfig.scaleFactor;
                const frameHeight = spriteConfig.frameHeight * spriteConfig.scaleFactor;
                
                cat.width = frameWidth;
                cat.height = frameHeight;
                
                ctx.drawImage(
                    sprite,
                    cat.spriteFrame * spriteConfig.frameWidth,
                    cat.spriteRow * spriteConfig.frameHeight,
                    spriteConfig.frameWidth,
                    spriteConfig.frameHeight,
                    cat.x,
                    cat.y,
                    frameWidth,
                    frameHeight
                );
            } else {
                ctx.fillStyle = '#A0A0A0';
                ctx.fillRect(cat.x, cat.y, 60, 40);
            }
        }

        let obstacleTimer = 0;
        let obstacleInterval = 100;

        function handleObstacles() {
            obstacleTimer++;
            if (obstacleTimer > obstacleInterval) {
                obstacles.push(new Obstacle());
                obstacleTimer = 0;
                obstacleInterval = 60 + Math.random() * 60;
            }

            obstacles.forEach(obstacle => {
                obstacle.update();
                obstacle.draw();
            });

            obstacles = obstacles.filter(obs => !obs.markedForDeletion);
        }

        function checkCollisions() {
            const hitboxPadding = 10;
            for (let obstacle of obstacles) {
                if (
                    cat.x + hitboxPadding < obstacle.x + obstacle.width &&
                    cat.x + cat.width - hitboxPadding > obstacle.x &&
                    cat.y + hitboxPadding < obstacle.y + obstacle.height &&
                    cat.y + cat.height - hitboxPadding > obstacle.y
                ) {
                    gameOver();
                }
            }
        }

        function drawGround() {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, ground.y, canvas.width, ground.height);
            
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, ground.y, canvas.width, 10);
        }

        function gameOver() {
            game.isRunning = false;
            finalScoreElement.textContent = game.score;
            gameOverScreen.style.display = 'block';
        }

        function restart() {
            game.speed = 5;
            game.score = 0;
            game.isRunning = true;
            game.frame = 0;
            
            cat.y = cat.groundY;
            cat.velocityY = 0;
            cat.isJumping = false;
            cat.spriteRow = 0;
            
            obstacles = [];
            obstacleTimer = 0;
            
            scoreElement.textContent = 'Счёт: 0';
            gameOverScreen.style.display = 'none';
            
            animate();
        }

        function animate() {
            if (!game.isRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGround();
            updateCat();
            drawCat();
            handleObstacles();
            checkCollisions();

            game.frame++;
            requestAnimationFrame(animate);
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!game.isRunning && loadingScreen.style.display === 'none' && gameOverScreen.style.display === 'none') {
                    game.isRunning = true;
                    instructions.style.display = 'none';
                    animate();
                } else {
                    jump();
                }
            }
        });

        canvas.addEventListener('click', () => {
            if (!game.isRunning && loadingScreen.style.display === 'none' && gameOverScreen.style.display === 'none') {
                game.isRunning = true;
                instructions.style.display = 'none';
                animate();
            } else {
                jump();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!game.isRunning && loadingScreen.style.display === 'none' && gameOverScreen.style.display === 'none') {
                game.isRunning = true;
                instructions.style.display = 'none';
                animate();
            } else {
                jump();
            }
        }, { passive: false });

        restartBtn.addEventListener('click', restart);
        restartBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            restart();
        });

        setTimeout(() => {
            if (spriteLoaded && !game.isRunning && gameOverScreen.style.display === 'none') {
                game.isRunning = true;
                animate();
            }
        }, 2000);
    </script>
</body>
</html>
