<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐱 Котик Тамагочи</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand(); tg.ready();
                if (tg.themeParams) {
                    document.documentElement.style.setProperty('--tg-bg', tg.themeParams.bg_color || '#fff');
                    document.documentElement.style.setProperty('--tg-text', tg.themeParams.text_color || '#000');
                }
            }
        });
    </script>
</head>
<body>
    <div class="tamagotchi">
        <div class="screen">
            <canvas id="mainCanvas"></canvas>
            <div class="stats-overlay">
                <div class="stat">🍖 <div class="bar"><div class="fill" id="hungerBar"></div></div></div>
                <div class="stat">😊 <div class="bar"><div class="fill" id="happyBar"></div></div></div>
                <div class="stat">💚 <div class="bar"><div class="fill" id="healthBar"></div></div></div>
                <div class="stat">⚡ <div class="bar"><div class="fill" id="energyBar"></div></div></div>
            </div>
            <div class="cat-name" id="catNameDisplay">КОТИК</div>
        </div>
        <div class="buttons">
            <a href="feed.html" class="btn btn-feed" title="Кормить">🍖</a>
            <a href="walk.html" class="btn btn-walk" title="Гулять">🚶</a>
            <a href="play.html" class="btn btn-play" title="Играть">🎮</a>
            <a href="heal.html" class="btn btn-heal" title="Лечить">💚</a>
            <button class="btn btn-sleep" onclick="toggleSleep()" title="Спать">💤</button>
        </div>
    </div>
    <script src="game.js"></script>
    <script>initMainScreen();</script>
</body>
</html>
