<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Котик Тамагочи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tamagotchi">
        <div class="screen">
            <canvas id="mainCanvas"></canvas>
            <div class="stats-overlay">
                <div class="stat">🍖 <div class="bar"><div class="fill" id="hungerBar"></div></div></div>
                <div class="stat">😊 <div class="bar"><div class="fill" id="happyBar"></div></div></div>
                <div class="stat">💚 <div class="bar"><div class="fill" id="healthBar"></div></div></div>
                <div class="stat">⚡ <div class="bar"><div class="fill" id="energyBar"></div></div></div>
            </div>
        </div>
        
        <div class="buttons">
            <a href="feed.html" class="btn btn-feed">🍖</a>
            <a href="walk.html" class="btn btn-walk">🚶</a>
            <a href="play.html" class="btn btn-play">🎮</a>
            <a href="heal.html" class="btn btn-heal">💚</a>
            <button class="btn btn-name" onclick="changeName()">✏️</button>
        </div>
        
        <div class="cat-name" id="catNameDisplay">КОТИК</div>
    </div>

    <script src="game.js"></script>
    <script>
        // Инициализация главного экрана
        initMainScreen();
    </script>
</body>
</html>
