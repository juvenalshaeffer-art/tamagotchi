<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Котик Тамагочи - Sega Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #000;
            font-family: 'Press Start 2P', cursive; overflow: hidden;
        }
        #gameContainer { 
            position: relative; width: 100%; max-width: 800px; height: 100vh;
            background: linear-gradient(180deg, #1a1a4e 0%, #0a0a2e 100%);
            border: 8px solid #4a4a4a;
        }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        
        .sega-button {
            position: absolute;
            padding: 15px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            border: 4px solid;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
        }
        .sega-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.5);
        }
        .btn-feed { background: #FF6B6B; border-color: #FF0000; color: #fff; bottom: 80px; left: 10px; }
        .btn-walk { background: #4ECDC4; border-color: #00FFFF; color: #000; bottom: 80px; left: 50%; transform: translateX(-50%); }
        .btn-play { background: #95E1D3; border-color: #00FF00; color: #000; bottom: 20px; left: 10px; }
        .btn-heal { background: #FFD93D; border-color: #FFA500; color: #000; bottom: 20px; left: 50%; transform: translateX(-50%); }
        .btn-name { background: #A8E6CF; border-color: #00FF00; color: #000; bottom: 20px; right: 10px; }
        
        #scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px);
            pointer-events: none; z-index: 100; opacity: 0.6;
        }
        
        .modal {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #2a2a6e 0%, #1a1a4e 100%);
            border: 6px solid #00FFFF; padding: 30px;
            box-shadow: 0 0 30px rgba(0,255,255,0.5);
            z-index: 200; text-align: center;
        }
        .modal h2 { color: #FFFF00; margin-bottom: 20px; font-size: 18px; }
        .modal input {
            font-family: 'Press Start 2P', cursive;
            padding: 10px; font-size: 14px;
            border: 4px solid #FFD93D;
            background: #000; color: #00FF00;
            margin-bottom: 20px; width: 100%;
        }
        .modal button {
            font-family: 'Press Start 2P', cursive;
            padding: 12px 25px; font-size: 12px;
            background: #00FF00; border: 4px solid #008000;
            cursor: pointer; color: #000;
        }
        
        .stats {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.8);
            border: 4px solid #FFD93D;
            padding: 15px; color: #fff;
            font-size: 9px; line-height: 2.2;
            z-index: 50;
        }
        .stat-bar {
            width: 120px; height: 14px;
            background: #333; border: 2px solid #fff;
            display: inline-block; margin-left: 10px;
        }
        .stat-fill {
            height: 100%; background: #00FF00;
            transition: width 0.3s;
        }
        
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none; z-index: 101;
        }

        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            border: 3px solid #FFFF00;
            padding: 10px 20px;
            color: #FFFF00;
            font-size: 9px;
            text-align: center;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="scanlines"></div>
        <div id="vignette"></div>
        
        <div class="stats">
            <div>🍖 ГОЛОД: <div class="stat-bar"><div class="stat-fill" id="hungerBar" style="width: 80%"></div></div></div>
            <div>😊 СЧАСТЬЕ: <div class="stat-bar"><div class="stat-fill" id="happyBar" style="width: 80%"></div></div></div>
            <div>💚 ЗДОРОВЬЕ: <div class="stat-bar"><div class="stat-fill" id="healthBar" style="width: 100%"></div></div></div>
            <div>⚡ ЭНЕРГИЯ: <div class="stat-bar"><div class="stat-fill" id="energyBar" style="width: 100%"></div></div></div>
            <div style="margin-top: 10px; color: #FFD93D;">🐱 ИМЯ: <span id="catName">КОТИК</span></div>
        </div>

        <div class="instructions" id="instructions">
            <div id="instructionText"></div>
        </div>
        
        <button class="sega-button btn-feed" onclick="startFeedGame()">🍖 КОРМИТЬ</button>
        <button class="sega-button btn-walk" onclick="startWalkGame()">🚶 ГУЛЯТЬ</button>
        <button class="sega-button btn-play" onclick="startPlayGame()">🎮 ИГРАТЬ</button>
        <button class="sega-button btn-heal" onclick="startHealGame()">💚 ЛЕЧИТЬ</button>
        <button class="sega-button btn-name" onclick="openNameModal()">✏️ ИМЯ</button>
        
        <div class="modal" id="nameModal">
            <h2>🐱 ВВЕДИ ИМЯ КОТИКА</h2>
            <input type="text" id="nameInput" maxlength="10" placeholder="КОТИК">
            <br>
            <button onclick="saveName()">OK</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const instructions = document.getElementById('instructions');
        const instructionText = document.getElementById('instructionText');
        
        const COLORS = {
            sky1: '#0060A0', sky2: '#0080C0', sky3: '#40A0E0',
            ground: '#804000', grass: '#00A800',
            cat1: '#C0C0C0', cat2: '#A0A0A0', cat3: '#808080',
            catLight: '#E0E0E0', catEye: '#FFD000', catNose: '#FF80A0',
            tree1: '#008000', tree2: '#00A000', trunk: '#603000',
            cloud: '#FFFFFF'
        };

        let catState = {
            name: 'КОТИК',
            hunger: 80,
            happiness: 80,
            health: 100,
            energy: 100
        };

        let gameMode = 'main';
        let frame = 0;
        let catX = 100;
        let catY = 0;
        let catVelocityY = 0;
        let isJumping = false;
        let groundY = 0;

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            groundY = canvas.height - 60;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 🍖 МИНИ-ИГРА: КОРМЛЕНИЕ
        let foodItems = [];
        let score = 0;
        
        function startFeedGame() {
            gameMode = 'feed';
            foodItems = [];
            score = 0;
            catX = 100;
            showInstruction('ЛОВИ РЫБКИ СТРЕЛКАМИ ВВЕРХ/ВНИЗ!');
        }

        function updateFeedGame() {
            if (Math.random() < 0.02) {
                foodItems.push({
                    x: canvas.width,
                    y: groundY - 50 - Math.random() * 150,
                    width: 25,
                    height: 25
                });
            }

            foodItems.forEach((food, i) => {
                food.x -= 5;
                
                if (catX < food.x + food.width && catX + 50 > food.x &&
                    catY < food.y + food.height && catY + 50 > food.y) {
                    foodItems.splice(i, 1);
                    score++;
                    catState.hunger = Math.min(100, catState.hunger + 8);
                    updateStats();
                }
                
                if (food.x < -50) foodItems.splice(i, 1);
            });
        }

        function drawFeedGame() {
            ctx.fillStyle = '#FF6B6B';
            foodItems.forEach(food => {
                ctx.fillRect(food.x, food.y, food.width, food.height);
                ctx.beginPath();
                ctx.moveTo(food.x, food.y + 12);
                ctx.lineTo(food.x - 10, food.y + 5);
                ctx.lineTo(food.x - 10, food.y + 20);
                ctx.fill();
            });
            
            ctx.fillStyle = '#FFFF00';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('СЪЕДЕНО: ' + score, 200, 50);
        }

        // 🚶 МИНИ-ИГРА: ПРОГУЛКА (прыжки через препятствия)
        let walkObstacles = [];
        let walkScore = 0;
        
        function startWalkGame() {
            gameMode = 'walk';
            walkObstacles = [];
            walkScore = 0;
            catX = 100;
            catY = groundY - 50;
            catVelocityY = 0;
            isJumping = false;
            showInstruction('ПРЫГАЙ ЧЕРЕЗ ПРЕПЯТСТВИЯ (ПРОБЕЛ)!');
        }

        function updateWalkGame() {
            catVelocityY += 0.8;
            catY += catVelocityY;
            if (catY >= groundY - 50) {
                catY = groundY - 50;
                isJumping = false;
                catVelocityY = 0;
            }

            if (Math.random() < 0.015) {
                walkObstacles.push({
                    x: canvas.width,
                    y: groundY - 40,
                    width: 30,
                    height: 40
                });
            }

            walkObstacles.forEach((obs, i) => {
                obs.x -= 6;
                
                if (catX < obs.x + obs.width && catX + 50 > obs.x &&
                    catY < obs.y + obs.height && catY + 50 > obs.y) {
                    walkObstacles = [];
                    catState.energy = Math.max(0, catState.energy - 10);
                    catState.happiness = Math.min(100, catState.happiness + 10);
                    updateStats();
                    gameMode = 'main';
                    hideInstruction();
                }
                
                if (obs.x < -50) {
                    walkObstacles.splice(i, 1);
                    walkScore++;
                }
            });

            catState.energy = Math.max(0, catState.energy - 0.05);
            updateStats();
        }

        function drawWalkGame() {
            ctx.fillStyle = '#4ECDC4';
            walkObstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });
            
            ctx.fillStyle = '#FFFF00';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('ПРОЙДЕНО: ' + walkScore, 200, 50);
        }

        // 🎮 МИНИ-ИГРА: МЯЧИК (пинг-понг)
        let ball = { x: 0, y: 0, dx: 0, dy: 0, size: 10 };
        let catPaddle = { x: 50, y: 0, width: 15, height: 60 };
        let handPaddle = { x: 0, y: 0, width: 15, height: 60 };
        let playScore = 0;
        
        function startPlayGame() {
            gameMode = 'play';
            ball = { 
                x: canvas.width / 2, 
                y: canvas.height / 2, 
                dx: 4, 
                dy: 3, 
                size: 10 
            };
            catPaddle = { x: 80, y: canvas.height / 2 - 30, width: 15, height: 60 };
            handPaddle = { x: canvas.width - 100, y: canvas.height / 2 - 30, width: 15, height: 60 };
            playScore = 0;
            showInstruction('ДВИГАЙ МЫШЬЮ ИЛИ ПАЛЬЦЕМ! ОТБИВАЙ МЯЧ!');
        }

        function updatePlayGame() {
            // Движение мяча
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Отскок от верха и низа
            if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                ball.dy = -ball.dy;
            }

            // Отскок от ракетки котика
            if (ball.x - ball.size < catPaddle.x + catPaddle.width &&
                ball.x + ball.size > catPaddle.x &&
                ball.y > catPaddle.y &&
                ball.y < catPaddle.y + catPaddle.height) {
                ball.dx = Math.abs(ball.dx) + 0.5;
                playScore++;
            }

            // Отскок от ракетки руки
            if (ball.x + ball.size > handPaddle.x &&
                ball.x - ball.size < handPaddle.x + handPaddle.width &&
                ball.y > handPaddle.y &&
                ball.y < handPaddle.y + handPaddle.height) {
                ball.dx = -Math.abs(ball.dx) - 0.5;
            }

            // ИИ руки
            const handCenter = handPaddle.y + handPaddle.height / 2;
            if (handCenter < ball.y - 20) {
                handPaddle.y += 3;
            } else if (handCenter > ball.y + 20) {
                handPaddle.y -= 3;
            }
            handPaddle.y = Math.max(0, Math.min(canvas.height - handPaddle.height, handPaddle.y));

            // Гол
            if (ball.x < 0) {
                // Проигрыш
                catState.happiness = Math.max(0, catState.happiness - 5);
                updateStats();
                gameMode = 'main';
                hideInstruction();
            }
            if (ball.x > canvas.width) {
                // Выигрыш очка
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
                ball.dx = -4;
                ball.dy = 3 * (Math.random() > 0.5 ? 1 : -1);
                playScore++;
                if (playScore >= 5) {
                    catState.happiness = Math.min(100, catState.happiness + 15);
                    updateStats();
                    gameMode = 'main';
                    hideInstruction();
                }
            }
        }

        function drawPlayGame() {
            // Ракетка котика
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(catPaddle.x, catPaddle.y, catPaddle.width, catPaddle.height);
            // Глаза на ракетке
            ctx.fillStyle = '#FFD000';
            ctx.fillRect(catPaddle.x + 3, catPaddle.y + 15, 4, 4);
            ctx.fillRect(catPaddle.x + 8, catPaddle.y + 15, 4, 4);

            // Ракетка руки
            ctx.fillStyle = '#FFB6C1';
            ctx.fillRect(handPaddle.x, handPaddle.y, handPaddle.width, handPaddle.height);
            // Пальцы
            ctx.fillStyle = '#FF69B4';
            for (let i = 0; i < 4; i++) {
                ctx.fillRect(handPaddle.x - 5, handPaddle.y + i * 15, 5, 10);
            }

            // Мяч
            ctx.fillStyle = '#FFFF00';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Счёт
            ctx.fillStyle = '#FFFF00';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('СЧЁТ: ' + playScore + '/5', canvas.width / 2 - 60, 50);
        }

        // 💚 МИНИ-ИГРА: ЛЕЧЕНИЕ
        let healTargets = [];
        
        function startHealGame() {
            gameMode = 'heal';
            healTargets = [];
            score = 0;
            
            for (let i = 0; i < 5; i++) {
                healTargets.push({
                    x: 200 + Math.random() * 300,
                    y: 150 + Math.random() * 200,
                    size: 20 + Math.random() * 15,
                    healed: false
                });
            }
            showInstruction('КЛИКАЙ НА КРАСНЫЕ КРУГИ (БОЛЯЧКИ)!');
        }

        function drawHealGame() {
            ctx.fillStyle = '#FF6B6B';
            healTargets.forEach(target => {
                if (!target.healed) {
                    ctx.beginPath();
                    ctx.arc(target.x, target.y, target.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#800000';
                    ctx.fillRect(target.x - 8, target.y - 3, 16, 6);
                    ctx.fillRect(target.x - 3, target.y - 8, 6, 16);
                    ctx.fillStyle = '#FF6B6B';
                }
            });
            
            ctx.fillStyle = '#FFFF00';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('ВЫЛЕЧЕНО: ' + score + '/5', 150, 50);
        }

        // Отрисовка котика
        function drawCat(x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.fillStyle = COLORS.cat1;
            ctx.fillRect(0, 20, 50, 30);
            ctx.fillStyle = COLORS.cat2;
            ctx.fillRect(0, 35, 50, 15);
            
            ctx.fillStyle = COLORS.cat3;
            ctx.fillRect(10, 22, 6, 24);
            ctx.fillRect(25, 22, 6, 24);
            ctx.fillRect(40, 22, 6, 24);
            
            ctx.fillStyle = COLORS.cat1;
            ctx.fillRect(40, 5, 32, 26);
            
            ctx.fillStyle = COLORS.cat2;
            ctx.fillRect(42, 0, 10, 10);
            ctx.fillRect(60, 0, 10, 10);
            ctx.fillStyle = COLORS.catLight;
            ctx.fillRect(44, 2, 6, 6);
            ctx.fillRect(62, 2, 6, 6);
            
            ctx.fillStyle = COLORS.catLight;
            ctx.fillRect(46, 10, 10, 10);
            ctx.fillRect(62, 10, 10, 10);
            ctx.fillStyle = COLORS.catEye;
            ctx.fillRect(48, 12, 6, 6);
            ctx.fillRect(64, 12, 6, 6);
            ctx.fillStyle = '#000';
            ctx.fillRect(50, 13, 3, 3);
            ctx.fillRect(66, 13, 3, 3);
            
            ctx.fillStyle = COLORS.catNose;
            ctx.fillRect(68, 20, 6, 5);
            
            ctx.fillStyle = COLORS.catLight;
            ctx.fillRect(35, 15, 12, 2);
            ctx.fillRect(35, 19, 12, 2);
            ctx.fillRect(35, 23, 12, 2);
            ctx.fillRect(74, 15, 12, 2);
            ctx.fillRect(74, 19, 12, 2);
            ctx.fillRect(74, 23, 12, 2);
            
            const tailWag = Math.sin(frame * 0.2) * 8;
            ctx.fillStyle = COLORS.cat2;
            ctx.fillRect(-20, 30 + tailWag, 25, 8);
            ctx.fillRect(-30, 25 + tailWag, 15, 8);
            
            const legOffset = isJumping ? 0 : Math.sin(frame * 0.3) * 8;
            ctx.fillStyle = COLORS.cat2;
            ctx.fillRect(5 + legOffset, 48, 8, 12);
            ctx.fillRect(20 - legOffset, 48, 8, 12);
            ctx.fillRect(42 + legOffset, 48, 8, 12);
            ctx.fillRect(55 - legOffset, 48, 8, 12);
            
            ctx.restore();
        }

        // Фон
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, groundY);
            gradient.addColorStop(0, COLORS.sky1);
            gradient.addColorStop(0.5, COLORS.sky2);
            gradient.addColorStop(1, COLORS.sky3);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, groundY);
            
            ctx.fillStyle = COLORS.cloud;
            for (let i = 0; i < 5; i++) {
                const x = ((frame * 0.5) + i * 200) % (canvas.width + 150) - 75;
                const y = 40 + (i % 3) * 30;
                ctx.fillRect(x, y, 80, 25);
                ctx.fillRect(x + 15, y - 15, 50, 20);
            }
            
            for (let i = 0; i < 6; i++) {
                const x = (i * 150 + 50) % canvas.width;
                ctx.fillStyle = COLORS.trunk;
                ctx.fillRect(x, groundY - 80, 12, 80);
                ctx.fillStyle = COLORS.tree1;
                ctx.fillRect(x - 25, groundY - 120, 50, 50);
                ctx.fillStyle = COLORS.tree2;
                ctx.fillRect(x - 20, groundY - 110, 40, 40);
            }
            
            ctx.fillStyle = COLORS.ground;
            ctx.fillRect(0, groundY, canvas.width, 60);
            ctx.fillStyle = COLORS.grass;
            ctx.fillRect(0, groundY, canvas.width, 12);
        }

        // Управление движением котика (для кормления)
        document.addEventListener('keydown', (e) => {
            if (gameMode === 'feed') {
                if (e.key === 'ArrowUp') catY = Math.max(0, catY - 30);
                if (e.key === 'ArrowDown') catY = Math.min(groundY - 50, catY + 30);
            }
            if (gameMode === 'walk' && e.code === 'Space') {
                e.preventDefault();
                if (!isJumping) {
                    catVelocityY = -12;
                    isJumping = true;
                }
            }
        });

        // Управление мышью/тачем (для игры с мячом)
        canvas.addEventListener('mousemove', (e) => {
            if (gameMode === 'play') {
                const rect = canvas.getBoundingClientRect();
                const y = e.clientY - rect.top;
                catPaddle.y = Math.max(0, Math.min(canvas.height - catPaddle.height, y - catPaddle.height / 2));
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameMode === 'play') {
                const rect = canvas.getBoundingClientRect();
                const y = e.touches[0].clientY - rect.top;
                catPaddle.y = Math.max(0, Math.min(canvas.height - catPaddle.height, y - catPaddle.height / 2));
            }
        }, { passive: false });

        // Клик для лечения
        canvas.addEventListener('click', (e) => {
            if (gameMode === 'heal') {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                healTargets.forEach(target => {
                    if (!target.healed) {
                        const dist = Math.sqrt((x - target.x) ** 2 + (y - target.y) ** 2);
                        if (dist < target.size + 10) {
                            target.healed = true;
                            score++;
                            if (score >= 5) {
                                catState.health = Math.min(100, catState.health + 30);
                                updateStats();
                                gameMode = 'main';
                                hideInstruction();
                            }
                        }
                    }
                });
            }
        });

        // Имя котика
        function openNameModal() {
            document.getElementById('nameModal').style.display = 'block';
            document.getElementById('nameInput').value = catState.name;
        }

        function saveName() {
            const newName = document.getElementById('nameInput').value.toUpperCase();
            if (newName) {
                catState.name = newName;
                document.getElementById('catName').textContent = newName;
            }
            document.getElementById('nameModal').style.display = 'none';
        }

        function updateStats() {
            document.getElementById('hungerBar').style.width = catState.hunger + '%';
            document.getElementById('happyBar').style.width = catState.happiness + '%';
            document.getElementById('healthBar').style.width = catState.health + '%';
            document.getElementById('energyBar').style.width = catState.energy + '%';
        }

        function showInstruction(text) {
            instructionText.textContent = text;
            instructions.style.display = 'block';
            setTimeout(hideInstruction, 5000);
        }

        function hideInstruction() {
            instructions.style.display = 'none';
        }

        setInterval(() => {
            if (gameMode === 'main') {
                catState.hunger = Math.max(0, catState.hunger - 1);
                catState.happiness = Math.max(0, catState.happiness - 0.5);
                catState.energy = Math.min(100, catState.energy + 0.3);
                
                if (catState.hunger < 30 || catState.happiness < 30) {
                    catState.health = Math.max(0, catState.health - 0.5);
                }
                
                updateStats();
            }
        }, 3000);

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();
            
            if (gameMode === 'main') {
                drawCat(catX, groundY - 50);
            } else if (gameMode === 'feed') {
                updateFeedGame();
                drawFeedGame();
                drawCat(catX, catY);
            } else if (gameMode === 'walk') {
                updateWalkGame();
                drawWalkGame();
                drawCat(catX, catY);
            } else if (gameMode === 'play') {
                updatePlayGame();
                drawPlayGame();
            } else if (gameMode === 'heal') {
                drawHealGame();
                drawCat(100, 150);
            }
            
            frame++;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
